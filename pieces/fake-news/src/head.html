<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fake News und Deepfakes</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d1a17; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { height: min(100vh, calc(100vw * 16 / 9)); width: auto; aspect-ratio: 9 / 16; display: block; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  FAKE NEWS & DEEPFAKES — 9:16 sketchbook explainer in German, timed to an ElevenLabs voice-over (VOICE).
// =====================================================================
const FPS = 24, W = 1080, H = 1920;
const BPM = 120, BEAT = 60 / BPM, E8 = BEAT / 2, E16 = BEAT / 4;
const DURATION = VOICE.duration;
const NFRAMES = Math.round(DURATION * FPS);
const LOOP_T = NFRAMES / FPS;
const SAFE = { top: 240, bottom: 420, right: 140 };
const HAND = '"Ink Free", "Segoe Print", "Bradley Hand", "Comic Sans MS", "Chalkboard SE", cursive';
const CX = 500;
// eras follow the voice: each starts 0.3s before its first line
const LT = (id) => VOICE.lines.find((l) => l.id === id);
const ERA_IDS = ['intro', 'feed', 'fake', 'spread', 'ki', 'real', 'ex_intro', 'ex_pope', 'ex_pentagon', 'ex_selenskyj', 'old', 'young', 'effects', 'qa_intro', 'q1', 'q2', 'q3', 'q4', 'check', 'outro'];
const ERA_T = [0, ...ERA_IDS.slice(1).map((id) => LT(id).t0 - 0.3), VOICE.duration];
const ERA_FN = [() => sIntro(), () => sFeed(), () => sFake(), () => sSpread(), () => sKI(), () => sReal(), () => sExIntro(), () => sPope(), () => sPentagon(), () => sSelenskyj(), () => sOld(), () => sYoung(), () => sEffects(), () => sQAIntro(), () => sQA(0), () => sQA(1), () => sQA(2), () => sQA(3), () => sCheck(), () => sOutro()];
const ERA_LIST = ERA_FN.map((f, i) => [ERA_T[i], ERA_T[i + 1], () => f()]);
const SHOT_TITLES = ERA_IDS;
const TIMELINE = {
  width: W, height: H, fps: FPS, bpm: BPM, duration: DURATION, frames: NFRAMES, loop: LOOP_T, safe: SAFE,
  format: 'morph-chain',
  shots: SHOT_TITLES.map((title, i) => ({ id: i + 1, key: 's' + i, era: i, t0: ERA_T[i], t1: ERA_T[i + 1], title })),
  cuts: [],
  morphs: ERA_T.slice(1, -1),
  cues: {},
  acts: [
    { name: '1 Medien & Fakes', role: 'setup', t0: 0, t1: ERA_T[6] },
    { name: '2 Echte Faelle', role: 'build', t0: ERA_T[6], t1: ERA_T[10] },
    { name: '3 Wen es trifft', role: 'turn', t0: ERA_T[10], t1: ERA_T[13] },
    { name: '4 Fragen & Antworten', role: 'build', t0: ERA_T[13], t1: ERA_T[18] },
    { name: '5 Merke', role: 'payoff', t0: ERA_T[18], t1: DURATION },
  ],
  board: ERA_T.slice(0, -1).map((t, i) => ({ t: Math.min(ERA_T[i + 1] - 0.6, t + 5.2), title: SHOT_TITLES[i], sound: '', next: '' })),
  narration: VOICE.lines.map((l) => ({ t0: l.t0, t1: l.t1, text: l.text })),
};
window.TIMELINE = TIMELINE;

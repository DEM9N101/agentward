// ---------------------------------------------------------------------
//  THE HERO: a terracotta dot with a cream asterisk, eyes, a mouth; arms and legs when it needs to act.
//  o: key, mood ('calm' | 'wow' | 'happy' | 'puzzled'), look [dx, dy] (-1..1), sx, sy (squash), rot,
//     legs (bool), step (-1..1 stride), arms [leftAngle, rightAngle] (radians up from horizontal; null = none)
//  Sets SPARK_AT (the hero's screen spot) for tools/review.
// ---------------------------------------------------------------------
function doodleHero(x, y, r, o = {}) {
  const key = o.key ?? 'hero', mood = o.mood ?? 'calm', lw = Math.max(3, r * 0.065);
  SPARK_AT = toScreen(x, y);

    const st = o.step ?? 0;
    for (const s of [-1, 1]) {

      gline([hip, foot], { w: lw, key: key + 'leg' + s, amp: 0.8, second: false, step: 8 });
      gline([foot, [foot[0] + s * r * 0.22, foot[1] + 2]], { w: lw * 1.25, key: key + 'ft' + s, amp: 0.5, second: false, step: 6 });
    }

    const ang = o.arms[i]; if (ang == null) return;
    const sh = [s * r * 0.9, r * 0.15], L = r * 0.85;
    const el = [sh[0] + s * L * 0.5 * Math.cos(ang * 0.6), sh[1] - L * 0.5 * Math.sin(ang * 0.6)], hd = [sh[0] + s * L * Math.cos(ang), sh[1] - L * Math.sin(ang)];
    gline([sh, el, hd], { w: lw, key: key + 'arm' + s, amp: 0.8, second: false, step: 8 });
    gline(loopPts(hd[0], hd[1], r * 0.09, r * 0.09, 0.1), { w: lw * 0.8, key: key + 'hd' + s, amp: 0.4, second: false, step: 5 });
  });

  gfill(body, SK.terra, { off: [r * 0.06, r * 0.05], key: key + 'f' });
  litHatch(body, { ang: -0.85, gap: Math.max(5, r * 0.08), col: SK.terraD, w: Math.max(1.6, r * 0.03), a: 0.85, key: key + 'h' });
  gline(loopPts(0, 0, r, r, 0.08), { w: lw, key: key + 'o' });
  for (let i = 0; i < 8; i++) {                                                // the cream asterisk on its crown
    const an = i / 8 * TAU + 0.2, r0 = r * 0.04, r1 = r * 0.19, cy = -r * 0.5;
    gline([[Math.cos(an) * r0, cy + Math.sin(an) * r0], [Math.cos(an) * r1, cy + Math.sin(an) * r1]], { w: r * 0.065, col: SK.cream, key: key + 'a' + i, amp: 0.4, second: false, step: 6 });
  }

  for (const s of [-1, 1]) {
    const ex = s * r * 0.3 + lx * r * 0.07, ey = r * 0.06 + ly * r * 0.07;
    if (blink) gline([[ex - r * 0.09, ey], [ex + r * 0.09, ey]], { w: lw * 0.9, key: key + 'bl' + s, amp: 0.3, second: false, step: 6 });
    else if (mood === 'happy') gline([[ex - r * 0.09, ey + r * 0.03], [ex, ey - r * 0.06], [ex + r * 0.09, ey + r * 0.03]], { w: lw * 0.9, key: key + 'hp' + s, amp: 0.3, second: false, step: 6 });
    else {
      ctx.fillStyle = SK.ink; ctx.beginPath(); ctx.ellipse(ex, ey, r * 0.085, r * (mood === 'wow' ? 0.15 : 0.12), 0, 0, TAU); ctx.fill();
      ctx.fillStyle = SK.cream; ctx.beginPath(); ctx.arc(ex - r * 0.025, ey - r * 0.045, r * 0.028, 0, TAU); ctx.fill();
    }
  }
  if (mood === 'puzzled') gline([[r * 0.18, -r * 0.16], [r * 0.42, -r * 0.24]], { w: lw * 0.8, key: key + 'brow', amp: 0.4, second: false, step: 6 });
  const my = r * 0.4;
  if (mood === 'wow') { ctx.fillStyle = SK.ink; ctx.beginPath(); ctx.ellipse(0, my + r * 0.02, r * 0.08, r * 0.1, 0, 0, TAU); ctx.fill(); }
  else if (mood === 'happy') { ctx.fillStyle = SK.ink; ctx.beginPath(); ctx.moveTo(-r * 0.2, my - r * 0.05); ctx.quadraticCurveTo(0, my + r * 0.3, r * 0.2, my - r * 0.05); ctx.closePath(); ctx.fill(); }
  else if (mood === 'puzzled') gline([[-r * 0.16, my], [-r * 0.05, my - r * 0.04], [r * 0.06, my + r * 0.03], [r * 0.16, my - r * 0.02]], { w: lw * 0.8, key: key + 'm', amp: 0.4, second: false, step: 5 });
  else gline(arcPts(0, my - r * 0.12, r * 0.16, Math.PI * 0.2, Math.PI * 0.8, 8), { w: lw * 0.8, key: key + 'm', amp: 0.4, second: false, step: 5 });
  ctx.restore();
  return body;
}

// ---------------------------------------------------------------------
//  CAPTIONS: the lettering is the narrator. Drawn after the camera (DEFER), at screen size.
//  pageTag(str)                 a marker label on masking tape, top left, written on at the era's start
//  pageCaption(lines, hi, o)    1–2 hand-lettered lines centred on CX, written on letter by letter;
//                               hi = [[lineIndex, 'word'], ...] gets a highlighter swipe once the line is down
// ---------------------------------------------------------------------

  const size = 70, w = letterW(str, size, 'marker'), x = 84, y = 340;

  const [x0, x1] = handLetter(str, x, y, size, { face: 'marker', align: 'left', reveal: ev(E0 + 0.1, 0.3), key: 'tag' + str, jit: 0.7 });
  underline(x0, x1, y + 20, { col: SK.red, w: 5, key: 'tagu' + str, part: ev(E0 + 0.4, 0.2) });
}
function pageCaptionDraw(lines, hi = [], o = {}) {
  const size = o.size ?? 80, y0 = o.y ?? 1330, lh = size * 1.12, t0 = E0 + (o.at ?? 0.35);
  lines.forEach((line, li) => {
    const y = y0 + li * lh, font = skFont(size, 'hand'), xs = glyphX(line, font), x0 = CX - xs[xs.length - 1] / 2;
    for (const [hl, word] of hi) if (hl === li) { const k = line.indexOf(word); if (k >= 0) highlight(x0 + xs[k], x0 + xs[k + word.length], y - size * 0.28, size * 0.55, ev(t0 + 0.5 + li * 0.25, 0.25), { key: 'caph' + li + line }); }

const pageTag = (str) => { const f = () => pageTagDraw(str); if (DEFER) DEFER.push(f); else f(); };

// =====================================================================
//  STYLE — the renderer's hooks (kit/morph.js). A morph happens on the bare page.
// =====================================================================
const STYLE = {
  name: 'sketchbook',
  paper: SK.paper,
  backdrop(c) {   // the page, washed toward colour c (c = the paper itself at the heart of a morph)
    fillAll(c);

  },
  window(P, key, src) {   // the world seen through a graphite outline, lifted off the page by a soft smudge shadow
    ctx.save();

    trace(P, true); ctx.fillStyle = SK.paper; ctx.fill();
    ctx.restore();
    ctx.save(); trace(P, true); ctx.clip(); ctx.drawImage(src, 0, 0); ctx.restore();
    gpencil(P, { closed: true, w: 3, a: 0.6, amp: 3.2, key: key + 'c', step: 14 });
    gline(P, { closed: true, w: 5.5, key: key + 'rim', step: 14 });
  },
  blob(P, c, key) {   // the shape mid-morph: a colour scribble inside a graphite outline
    gfill(P, c, { a: 0.3, off: [6, 5], key: key + 'f' });
    scribbleFill(P, c, { key: key + 's', gap: 12, w: 4, base: 0.25 });

  },
  hero(x, y, r, o) { doodleHero(x, y, r * 0.6, { ...o, key: o.key }); },
  heroColor: SK.terra,
  heroPts: (x, y, r) => ellipsePts(x, y, r * 0.6, r * 0.6, 0, 96),
  post() { grain({ n: 1800, dark: 'rgba(60,56,52,0.12)', light: 'rgba(255,253,245,0.16)' }); },
};
// =====================================================================
//  SCENES — Fake News & Deepfakes (sketchbook, German). World 1080x1920; TT on 2s; E0 = era start.

// ---- helpers
function bubble(x, y, w, h, tail, key, part, fill = SK.sheet) {
  const P = sketchBox(x - w / 2, y - h / 2, w, h, Math.min(34, h / 2.5), 0);
  if (part <= 0) return;
  gfill(P, fill, { off: [3, 3], key: key + 'f', a: clamp(part * 3) });
  gline(P, { closed: true, w: 4, key: key + 'o', part });
  if (tail) gline([[x + tail[0] * 0.3 - 18, y + h / 2 - 2], [x + tail[0], y + h / 2 + tail[1]], [x + tail[0] * 0.3 + 18, y + h / 2 - 2]], { w: 4, key: key + 't', second: false, part: seg(part, 0.6, 1) });
}
function penOn(P, t0, d) { if (TT >= t0 && TT < t0 + d + 0.08) { const tip = writeEnd(closeP(P), ev(t0, d)); pencilTool(tip[0], tip[1], -0.75 + 0.08 * Math.sin(B * 1.7), 1); } }
function drawn(P, t0, d, key, o = {}) {      // pencil construction, then ink, then the pencil follows
  const p = ev(t0, d);
  if (p <= 0) return 0;
  if (o.fill) gfill(P, o.fill, { key: key + 'f', a: clamp(p * 2), off: o.off ?? [4, 3] });
  gpencil(P, { closed: true, key: key + 'c', w: 2.4, a: 0.6 * (1 - ev(t0 + d, 0.3)), part: p });
  gline(P, { closed: true, key, w: o.w ?? 5, part: ev(t0 + d * 0.6, d * 0.5) });
  if (o.pen !== false) penOn(P, t0, d);
  return p;
}
function face(cx, cy, s, key, o = {}) {      // a plain ink portrait face (not the hero)
  const head = loopPts(cx, cy, 95 * s, 120 * s, 0.05);
  gfill(head, o.skin ?? SKIN, { key: key + 'sk' });
  if (o.hair !== false) {
    const H = [[cx - 100 * s, cy - 30 * s], [cx - 85 * s, cy - 115 * s], [cx, cy - 150 * s], [cx + 85 * s, cy - 115 * s], [cx + 100 * s, cy - 30 * s], [cx + 40 * s, cy - 95 * s], [cx - 50 * s, cy - 90 * s]];
    ctx.save(); gclip(H); ghatch(cx - 110 * s, cy - 160 * s, cx + 110 * s, cy - 20 * s, { ang: -0.8, gap: 7, col: o.hairCol ?? SK.ink, w: 2.2, a: 0.7, key: key + 'hh' }); ctx.restore();
    gline(H, { w: 3.5, key: key + 'hr', closed: true, amp: 1 });
  }
  gline(head, { w: 5, key: key + 'h' });
  for (const sx of [-1, 1]) { ctx.fillStyle = SK.ink; ctx.beginPath(); ctx.ellipse(cx + sx * 34 * s, cy - 6 * s, 9 * s, (o.wow ? 15 : 12) * s, 0, 0, TAU); ctx.fill(); }
  gline([[cx, cy + 2 * s], [cx - 9 * s, cy + 32 * s], [cx + 6 * s, cy + 36 * s]], { w: 3.5, key: key + 'n', second: false });
  if (o.wow) { ctx.fillStyle = SK.ink; ctx.beginPath(); ctx.ellipse(cx, cy + 66 * s, 13 * s, 17 * s, 0, 0, TAU); ctx.fill(); }
  else gline(arcPts(cx, cy + 40 * s, 36 * s, Math.PI * 0.2, Math.PI * 0.8, 8), { w: 4, key: key + 'm', second: false });
  if (o.glasses) { for (const sx of [-1, 1]) gline(loopPts(cx + sx * 34 * s, cy - 6 * s, 27 * s, 23 * s, 0.05), { w: 3.5, key: key + 'g' + sx }); gline([[cx - 8 * s, cy - 8 * s], [cx + 8 * s, cy - 8 * s]], { w: 3, key: key + 'gb', second: false }); }
}
function oldie(x, y, s, key, o = {}) {        // an older person: white hair, glasses, cardigan
  const body = [[x - 95 * s, y + 330 * s], [x - 75 * s, y + 140 * s], [x + 75 * s, y + 140 * s], [x + 95 * s, y + 330 * s]];
  gfill(body, '#cfd8dc', { key: key + 'bf' }); gline(body, { w: 5, key: key + 'b' });
  for (let i = 0; i < 3; i++) { ctx.fillStyle = SK.ink; ctx.beginPath(); ctx.arc(x, y + (180 + i * 45) * s, 5 * s, 0, TAU); ctx.fill(); }
  face(x, y, s * 1.05, key, { glasses: true, hairCol: SK.graphL ?? '#9a948b', wow: o.wow });
}
function girl(x, y, s, key, o = {}) {         // the questioner: an ink doodle girl with a ponytail
  gline([[x + 70 * s, y - 70 * s], [x + 120 * s, y - 40 * s + 8 * Math.sin(B)], [x + 110 * s, y + 10 * s]], { w: 6, key: key + 'pt', second: false });
  face(x, y, s, key, { hairCol: SK.ink, wow: o.wow });
}
function stamp(str, x, y, s, rot, t, key) { const k = ev(stampAt(t), 0.15); if (k > 0) inkStamp(str, x, y, s * (1.4 - 0.4 * k), rot, k, key); }
function phoneIcon(x, y, w, h, key, o = {}) {
  const P = sketchBox(x - w / 2, y - h / 2, w, h, Math.min(w, h) * 0.14);
  gfill(P, o.fill ?? SK.sheet, { key: key + 'f', off: [0, 0] }); gline(P, { w: o.w ?? 4, key });
  gline([[x - w * 0.15, y - h / 2 + h * 0.06], [x + w * 0.15, y - h / 2 + h * 0.06]], { w: 3, key: key + 's', second: false });
}
function heart(x, y, s, key, col = SK.red) {
  const P = []; for (let i = 0; i <= 24; i++) { const t = i / 24 * TAU; P.push([x + s * 16 * Math.pow(Math.sin(t), 3) / 16, y - s * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16]); }
  gfill(P, col, { key: key + 'f', off: [2, 2] }); gline(P, { w: 3, key, closed: true });
}
function margins(key) { [[90, 560, 0], [120, 1180, 1], [950, 1250, 2]].forEach(([x, y, i]) => doodleStar(x, y, 18 + 5 * ((B + i) % 3 === 0), key + i, { w: 3 })); }
function textLines(x, y, ws, gap, key, t0) { ws.forEach((w, i) => gpencil([[x, y + i * gap], [x + w, y + i * gap]], { key: key + i, w: 3, a: 0.8, part: t0 == null ? 1 : ev(t0 + i * 0.12, 0.15) })); }
function caption2(a, b, tSwap, hiA, hiB) { if (TT < tSwap) pageCaption(a, hiA); else pageCaption(b, hiB, { at: tSwap - E0 + 0.1 }); }

// ================= 4 SPREAD =================
function treePos() {
  const L = [[[500, 560]]], xs = (n, y) => Array.from({ length: n }, (_, i) => [lerp(170, 830, n === 1 ? 0.5 : i / (n - 1)), y]);
  L.push(xs(2, 760), xs(4, 940), xs(8, 1110)); return L;
}
function sSpread() {
  sketchPage({ grid: 'dots' });
  const L = treePos(), sc = [1, 0.8, 0.62, 0.42];
  for (let l = 1; l < 4; l++) {
    const t0 = A(0.8 + (l - 1) * 1.3);
    L[l].forEach(([x, y], i) => {
      const [px, py] = L[l - 1][i >> 1], k = ev(t0 + i * 0.06, 0.45);
      if (k <= 0) return;
      arrowPencil([[px, py + 40 * sc[l - 1]], [lerp(px, x, 0.5), lerp(py, y, 0.5) - 10], [x, y - 44 * sc[l]]], k, { key: 'sa' + l + i });
      if (k > 0.6) noteCard(x, y, ((i % 3) - 1) * 0.1, sc[l], 1, 'sc' + l + i, SK.red);
    });
  }
  noteCard(500, 560, -0.04, 1, 1, 'sc0', SK.red);
  const n = Math.floor(Math.pow(10, 6 * EZ.i2(seg(TT, A(0.8), A(5.0)))));
  handLetter('geteilt:', 780, 440, 44, { col: SK.graph, key: 'gt' });
  handLetter(n.toLocaleString('de-DE'), 780, 500, 56, { face: 'marker', key: 'gn' + (B % 2) });
  const sw = TT > A(3);
  doodleHero(170, 520, 60, { key: 'hero', mood: sw ? 'wow' : 'calm', look: [1, 0.3], arms: [-0.8, 0.8] });
  if (sw) for (let i = 0; i < 2; i++) sweat(110 - i * 12, 480 + i * 8, ((TT * 1.3 + i * 0.5) % 1), 'sw' + i);
  pageTag('Teilen');
  pageCaption(['Lügen verbreiten', 'sich schneller'], [[1, 'schneller']], { at: 0.8 });
}

function puffer(x, y, s, key) {   // a figure in a long white puffer coat, small white cap
  const segs = 6;
  for (let i = 0; i < segs; i++) {
    const w = (150 + i * 14) * s, yy = y + 120 * s + i * 62 * s;
    const P = sketchBox(x - w / 2, yy, w, 66 * s, 30 * s, 0);
    gfill(P, '#ffffff', { key: key + 'pf' + i, off: [3, 3] });
    ctx.save(); gclip(P); ghatch(x - w / 2, yy + 40 * s, x + w / 2, yy + 66 * s, { ang: -0.6, gap: 7, col: SK.graph, w: 1.6, a: 0.4, key: key + 'ph' + i }); ctx.restore();
    gline(P, { w: 3.5, key: key + 'po' + i, closed: true });
